<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Mountain Background Gradient -->
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.85" />
    </linearGradient>

    <!-- Forest Gradients -->
    <linearGradient id="treeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="treeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- School Gate Architecture -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="signBoardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    
    <!-- Subtle Left Vignette for Header Contrast -->
    <linearGradient id="subtleVignette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#020617" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1400" height="450" fill="url(#skyGrad)" />

  <!-- Glowing Sun -->
  <circle cx="1180" cy="85" r="75" fill="#fef08a" opacity="0.6" filter="blur(16px)" />
  <circle cx="1180" cy="85" r="38" fill="#ffffff" opacity="0.95" />

  <!-- Fluffy White Clouds -->
  <g fill="#ffffff" opacity="0.75">
    <path d="M 120 80 Q 150 45 190 60 Q 230 40 270 65 Q 310 50 340 80 Q 350 110 310 115 L 140 115 Z" />
    <path d="M 820 60 Q 860 30 900 48 Q 940 25 980 50 Q 1020 40 1045 70 L 830 70 Z" opacity="0.6" />
    <path d="M 600 95 Q 630 75 660 85 Q 690 70 720 90 L 610 95 Z" opacity="0.5" />
  </g>

  <!-- Distant Mountains of Đông Giang -->
  <path d="M 0 310 Q 250 170 520 260 T 1000 230 Q 1200 180 1400 250 L 1400 450 L 0 450 Z" fill="url(#mountainGrad1)" />
  <path d="M 0 350 Q 320 220 650 300 T 1400 290 L 1400 450 L 0 450 Z" fill="url(#mountainGrad2)" />

  <!-- Lush Green Trees / Hills (Left side) -->
  <g fill="url(#treeGrad1)">
    <circle cx="120" cy="280" r="130" />
    <circle cx="280" cy="300" r="110" />
    <circle cx="0" cy="260" r="120" />
  </g>
  <g fill="url(#treeGrad2)">
    <circle cx="180" cy="310" r="120" />
    <circle cx="340" cy="330" r="90" />
  </g>

  <!-- Lush Green Trees / Hills (Right side) -->
  <g fill="url(#treeGrad1)">
    <circle cx="1280" cy="280" r="130" />
    <circle cx="1120" cy="300" r="110" />
    <circle cx="1400" cy="260" r="120" />
  </g>
  <g fill="url(#treeGrad2)">
    <circle cx="1220" cy="310" r="120" />
    <circle cx="1060" cy="330" r="90" />
  </g>

  <!-- Festive Pennant Bunting Flags -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <path d="M 330 150 Q 560 195 790 150" fill="none" />
    <polygon points="360,162 385,166 372,192" fill="#ef4444" stroke="none" />
    <polygon points="410,169 435,172 422,199" fill="#eab308" stroke="none" />
    <polygon points="460,175 485,177 472,204" fill="#3b82f6" stroke="none" />
    <polygon points="510,178 535,179 522,206" fill="#22c55e" stroke="none" />
    <polygon points="560,179 585,178 572,206" fill="#ec4899" stroke="none" />
    <polygon points="610,177 635,174 622,203" fill="#f97316" stroke="none" />
    <polygon points="660,172 685,168 672,197" fill="#8b5cf6" stroke="none" />
    <polygon points="710,165 735,161 722,190" fill="#06b6d4" stroke="none" />
  </g>

  <!-- Main School Gate Architecture (Center) -->
  <g id="SchoolGate" transform="translate(420, 110)">
    <!-- Gate Roof Top (Curved Red Clay Tile Roof) -->
    <path d="M 30 70 Q 280 20 530 70 L 510 95 Q 280 50 50 95 Z" fill="url(#roofGrad)" stroke="#7f1d1d" stroke-width="2" />
    <path d="M 10 70 Q 280 0 550 70 L 530 78 Q 280 15 30 78 Z" fill="#b91c1c" />

    <!-- Supporting Arch Beam -->
    <rect x="70" y="90" width="420" height="28" fill="url(#pillarGrad)" rx="4" stroke="#334155" stroke-width="2" />

    <!-- Left Main Pillar -->
    <rect x="80" y="115" width="60" height="235" fill="url(#pillarGrad)" stroke="#334155" stroke-width="3" />
    <rect x="75" y="115" width="70" height="15" fill="#64748b" stroke="#1e293b" />
    <rect x="70" y="330" width="80" height="20" fill="#475569" stroke="#1e293b" />

    <!-- Right Main Pillar -->
    <rect x="420" y="115" width="60" height="235" fill="url(#pillarGrad)" stroke="#334155" stroke-width="3" />
    <rect x="415" y="115" width="70" height="15" fill="#64748b" stroke="#1e293b" />
    <rect x="410" y="330" width="80" height="20" fill="#475569" stroke="#1e293b" />

    <!-- Grand Name Signboard in Center -->
    <rect x="155" y="125" width="250" height="90" fill="url(#signBoardGrad)" rx="8" stroke="url(#goldText)" stroke-width="3.5" />
    <text x="280" y="146" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">
      SỞ GIÁO DỤC VÀ ĐÀO TẠO TP ĐÀ NẴNG
    </text>
    <text x="280" y="172" text-anchor="middle" fill="url(#goldText)" font-size="16" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1.5">
      TRƯỜNG THPT QUANG TRUNG
    </text>
    <text x="280" y="196" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="3">
      ★ ĐÔNG GIANG ★
    </text>

    <!-- Iron Gate Details (Lower) -->
    <g stroke="#38bdf8" stroke-width="2.5" opacity="0.85">
      <line x1="150" y1="260" x2="410" y2="260" />
      <line x1="150" y1="310" x2="410" y2="310" />
      <line x1="180" y1="240" x2="180" y2="340" />
      <line x1="220" y1="240" x2="220" y2="340" />
      <line x1="260" y1="240" x2="260" y2="340" />
      <line x1="300" y1="240" x2="300" y2="340" />
      <line x1="340" y1="240" x2="340" y2="340" />
      <line x1="380" y1="240" x2="380" y2="340" />
    </g>
  </g>

  <!-- Paved Front Ground -->
  <rect x="0" y="420" width="1400" height="30" fill="#475569" opacity="0.9" />

  <!-- Subtle Vignette overlay -->
  <rect width="600" height="450" fill="url(#subtleVignette)" pointer-events="none" />
</svg>
