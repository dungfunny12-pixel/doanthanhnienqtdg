<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Golden Border -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="250" cy="250" r="165" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Circular Text: Upper Arc -->
  <path id="textArcTop" d="M 65 250 A 185 185 0 0 1 435 250" fill="none" />
  <text fill="url(#goldGrad)" font-size="25" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="3.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      TRƯỜNG THPT QUANG TRUNG
    </textPath>
  </text>

  <!-- Circular Text: Lower Arc -->
  <path id="textArcBottom" d="M 435 250 A 185 185 0 0 1 65 250" fill="none" />
  <text fill="url(#goldGrad)" font-size="23" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ★ ĐÔNG GIANG - ĐÀ NẴNG ★
    </textPath>
  </text>

  <!-- Center Elements: Open Book of Knowledge -->
  <g transform="translate(250, 275)">
    <!-- Book Pages -->
    <path d="M 0 35 Q -45 5 -100 15 L -95 -45 Q -45 -45 0 -25 Q 45 -45 95 -45 L 100 15 Q 45 5 0 35 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <path d="M 0 35 L 0 -25" stroke="#334155" stroke-width="3" />
    <!-- Book Lines (symbolic writing) -->
    <path d="M -80 -25 Q -45 -25 -15 -10 M -80 -10 Q -45 -10 -15 5 M -80 5 Q -45 5 -15 20" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 80 -25 Q 45 -25 15 -10 M 80 -10 Q 45 -10 15 5 M 80 5 Q 45 5 15 20" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <!-- Book Spine Ribbon -->
    <polygon points="0,35 -8,55 0,50 8,55" fill="#dc2626" />
  </g>

  <!-- Center Elements: Burning Torch of Knowledge & Ambition -->
  <g transform="translate(250, 195)">
    <!-- Torch Handle -->
    <path d="M -8 35 L 8 35 L 5 70 L -5 70 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="1.5" />
    <ellipse cx="0" cy="35" rx="14" ry="5" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="1.5" />
    <!-- Flaming Fire -->
    <path d="M 0 32 C -18 10 -22 -20 -10 -38 C -5 -25 5 -20 0 -5 C 10 -15 18 -35 15 -52 C 28 -28 25 5 0 32 Z" fill="url(#flameGrad)" filter="url(#glow)" />
    <!-- Inner bright core flame -->
    <path d="M 0 28 C -8 15 -10 -2 -3 -15 C -1 -5 3 -2 0 6 C 5 0 10 -12 8 -22 C 15 -8 12 12 0 28 Z" fill="#fef08a" />
  </g>

  <!-- Laurel Wreath Leaves surrounding bottom -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <path d="M 170 330 Q 155 350 130 360 Q 148 340 170 330 Z" />
    <path d="M 190 350 Q 180 375 160 390 Q 172 368 190 350 Z" />
    <path d="M 220 370 Q 215 395 200 410 Q 208 388 220 370 Z" />
    <path d="M 330 330 Q 345 350 370 360 Q 352 340 330 330 Z" />
    <path d="M 310 350 Q 320 375 340 390 Q 328 368 310 350 Z" />
    <path d="M 280 370 Q 285 395 300 410 Q 292 388 280 370 Z" />
  </g>
</svg>
